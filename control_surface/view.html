<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rig view</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccd; overflow: hidden;
               font: 14px -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  /* Alignment guides for a clip-on / Cardboard stereo viewer: two fixed vertical lines either
     side of the screen centre, drawn over the picture. */
  .guide { position: fixed; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #1c1c1c;
           z-index: 2; pointer-events: none; }
  #gl { left: calc(50% - 8.5px); }
  #gr { left: calc(50% + 8.5px); }
  /* The picture is centred and can be smaller than the screen (black on all sides), so that
     the two eye pictures sit under the lenses of a phone viewer: their centres are half the
     picture width apart. */
  :root { --sw: 100vw; --sh: 100vh; --w: var(--sw); }
  :root.phone { --w: calc(var(--sw) * 0.865); }
  #root { position: fixed; top: 0; left: 0; width: var(--sw); height: var(--sh); overflow: hidden; }
  /* the guide lines are for the phone viewer, which is used in landscape only */
  @media (orientation: portrait) { .guide { display: none; } }
  #pic { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block;
         width: min(var(--w), var(--sw), calc(var(--sh) * 32 / 9)); aspect-ratio: 32 / 9; }
  #bar { z-index: 3; position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 8px; align-items: center;
         padding: 10px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
         background: rgba(17, 20, 26, .88); }
  body.ui #bar { display: flex; }
  button, a.btn { font: inherit; color: #ccd; background: #222733; border: 1px solid #343b4b; border-radius: 8px;
                  padding: 8px 12px; text-decoration: none; }
  button.on { background: #2d5fd0; border-color: #2d5fd0; color: #fff; }
  #stat { margin-left: auto; color: #8a93a6; font-variant-numeric: tabular-nums; }
  #stat.bad { color: #ff8a70; }
  /* Stereo control overlay: the same narrow list of named controls drawn once in each eye's
     picture, hard against its left edge, so through a phone stereo viewer it fuses into one
     panel. The two copies are offset towards each other by --pop, which sets how near the
     panel floats (it follows the rig's global zero so it sits at the picture's own depth).
     Faint until used. Thumbs stay OUT of the pictures: the black margin left of the picture
     moves the highlight up and down the list (tap = select / flip), the margin on the right
     is one vertical slider for the highlighted control. */
  #hud { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; display: none;
         width: min(var(--w), var(--sw), calc(var(--sh) * 32 / 9)); aspect-ratio: 32 / 9; pointer-events: none;
         --ew: 400px; --pop: 0px; --base: 0px; font-size: calc(var(--ew) * 0.033); }
  body.hud #hud { display: block; }
  .eye { position: absolute; top: 0; height: 100%; width: 50%; overflow: hidden; }
  #eyeL { left: 0; --dx: calc(var(--pop) / 2); }
  #eyeR { left: 50%; --dx: calc(var(--pop) / -2); }
  /* per eye, left to right: nav column (up / select / down), the list, ... , the slider at
     the right edge. All of it is drawn in both eyes at the same depth; the left thumb uses
     the left eye's nav column, the right thumb the right eye's slider. */
  .nav, .vs { position: absolute; top: 4%; bottom: 4%; width: 11%; pointer-events: auto; touch-action: none;
              border-radius: .4em; background: rgba(0, 0, 0, .30); color: #d8dce6; opacity: .42; transition: opacity .6s; }
  #hud.live .nav, #hud.live .vs { opacity: 1; transition: opacity .1s; background: rgba(0, 0, 0, .55); }
  .nav { left: calc(var(--base) + var(--dx)); display: flex; flex-direction: column; }
  .nav div { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 1.5em; }
  .nav div + div { border-top: 1px solid rgba(255, 255, 255, .14); }
  .vs { right: calc(var(--base) - var(--dx)); }
  .vs .track { position: absolute; left: 50%; top: 9%; bottom: 9%; width: 2px; margin-left: -1px;
               background: rgba(255, 255, 255, .30); }
  .vs .knob { position: absolute; left: 50%; width: 1.5em; height: 1.5em; margin: -.75em 0 0 -.75em; border-radius: 50%;
              background: rgba(120, 165, 255, .95); display: none; }
  .panel { position: absolute; left: calc(var(--base) + var(--dx) + 12%); top: 4%; bottom: 4%; width: 38%; pointer-events: auto;
           display: flex; flex-direction: column; border-radius: .4em; overflow: hidden;
           background: rgba(0, 0, 0, .30); color: #d8dce6; opacity: .42; transition: opacity .6s; }
  #hud.live .panel { opacity: 1; transition: opacity .1s; background: rgba(0, 0, 0, .55); }
  .phead { padding: .45em .6em; flex: none; border-bottom: 1px solid rgba(255, 255, 255, .16); font-weight: 600;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The list works like a picker wheel: the row on the centre line is the highlighted one,
     however it got there (scrolling, or the up / down buttons). */
  .plist { flex: 1; position: relative; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
           scroll-snap-type: y mandatory; scrollbar-width: none; }
  .plist::-webkit-scrollbar { display: none; }
  .prow { scroll-snap-align: center; }
  /* while the right-hand slider is being dragged the whole overlay gets out of the way */
  #hud.adjust .panel, #hud.adjust .nav, #hud.adjust .vs { opacity: 0 !important; transition: opacity .15s; }
  .prow { position: relative; display: flex; align-items: baseline; gap: .5em; padding: .8em .6em .85em;
          border-bottom: 1px solid rgba(255, 255, 255, .07); }
  .prow .lab { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .val { flex: none; font-variant-numeric: tabular-nums; color: #fff; }
  .prow .fill { position: absolute; left: 0; bottom: 0; height: 2px; background: rgba(110, 160, 255, .9); }
  .prow.cur { background: rgba(70, 130, 255, .34); color: #fff; }
  .prow.dim { color: #8a90a0; }
  .prow.sect { letter-spacing: .05em; text-transform: uppercase; color: #aab2c6; }
  .prow.sect.cur { color: #fff; }
  .prow.l1 { padding-left: 1.4em; } .prow.l2 { padding-left: 2.2em; } .prow.l3 { padding-left: 3em; }
  .strip { position: fixed; top: 0; bottom: 0; z-index: 2; display: none; touch-action: none;
           width: max(48px, calc((var(--sw) - min(var(--w), var(--sw), var(--sh) * 32 / 9)) / 2)); }
  body.hud .strip { display: block; }
  #ls { left: 0; } #rs { right: 0; }
  body:not(.hud) .hudonly { display: none; }
  /* The control page opens inside this page (no navigation), so a Home Screen web app keeps
     running without iOS adding its browser bar. */
  #ctlwrap { position: fixed; inset: 0; z-index: 5; background: #0e1013; display: none; }
  #ctlwrap.on { display: block; }
  #ctl { position: absolute; border: 0; top: env(safe-area-inset-top); left: env(safe-area-inset-left);
         width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
         height: calc(100% - env(safe-area-inset-top)); }
</style>
<link rel="manifest" href="/manifest.json">
</head>
<body>
<div id="root">
<div class="guide" id="gl"></div><div class="guide" id="gr"></div>
<img id="pic" alt="">
<div id="hud">
  <div class="eye" id="eyeL"><div class="nav"><div>&#9650;</div><div>&#9679;</div><div>&#9660;</div></div><div class="panel"><div class="phead"></div><div class="plist"></div></div><div class="vs"><div class="track"><div class="knob"></div></div></div></div>
  <div class="eye" id="eyeR"><div class="nav"><div>&#9650;</div><div>&#9679;</div><div>&#9660;</div></div><div class="panel"><div class="phead"></div><div class="plist"></div></div><div class="vs"><div class="track"><div class="knob"></div></div></div></div>
</div>
<div class="strip" id="ls"></div>
<div class="strip" id="rs"></div>
<div id="bar">
  <button id="full">Full screen</button>
  <button id="overlay">Overlay</button>
  <button id="controls">Controls</button>
  <span id="stat">connecting…</span>
</div>
</div>
<div id="ctlwrap"></div>
<script>
var pic = document.getElementById('pic'), bar = document.getElementById('bar'),
    stat = document.getElementById('stat'),
    fullBtn = document.getElementById('full');
var seq = 0, shown = [], lastUrl = null, hideTimer = null;

// The picture fills the screen with nothing over it. A tap shows the bar; another tap, or
// 5 s without touching it, hides it again.
function showUi(on) {
  document.body.classList.toggle('ui', on);
  clearTimeout(hideTimer);
  if (on) hideTimer = setTimeout(function () { showUi(false); }, 5000);
}
document.addEventListener('click', function (e) {
  if (e.target.closest && e.target.closest('.panel, .strip, .nav, .vs')) return;
  if (!bar.contains(e.target)) showUi(!document.body.classList.contains('ui'));
});
bar.onclick = function () { showUi(true); };

var root = document.documentElement;
var goFull = root.requestFullscreen || root.webkitRequestFullscreen;
if (!goFull) fullBtn.style.display = 'none';      // iPhone Safari: use Add to Home Screen instead
fullBtn.onclick = function () {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    try { goFull.call(root); } catch (e) {}
  }
};

// Picture width: fixed at 86.5 % of the screen width on a phone (set by eye against a
// Cardboard-type viewer, 2026-11-20); full width on bigger screens.
if (Math.max(screen.width, screen.height) < 1000) document.documentElement.classList.add('phone');

function width() { return 2560; }      // 1280 per eye: about what a phone shows per eye

// Frames arrive over one WebSocket as binary JPEGs. The page asks for the next frame only
// when the previous one is on screen, so the rate follows what the link and phone can do
// (up to the rig's 30 fps) and frames never queue up behind each other.
var ws = null, pending = null, waiting = null, paused = false;

function ask() {
  if (ws && ws.readyState === 1) {
    ws.send(String(width()));
    clearTimeout(waiting);
    waiting = setTimeout(function () { try { ws.close(); } catch (e) {} }, 5000);
  }
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/live');
  ws.binaryType = 'blob';
  ws.onopen = ask;
  ws.onmessage = function (e) {
    if (typeof e.data === 'string') {            // "none": no relay instance has a picture
      stat.className = 'bad';
      stat.textContent = 'no picture, retrying';
      setTimeout(ask, 1000);
      return;
    }
    var url = URL.createObjectURL(e.data), size = e.data.size;
    pic.onload = pic.onerror = function () {
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = url;
      var now = Date.now();
      shown.push(now);
      while (shown.length && now - shown[0] > 2000) shown.shift();
      stat.className = '';
      stat.textContent = (shown.length / 2).toFixed(0) + ' fps · ' + Math.round(size / 1024) + ' KB';
      if (document.hidden || paused) pending = true; else ask();
    };
    pic.src = url;
  };
  ws.onclose = function () {
    clearTimeout(waiting);
    stat.className = 'bad';
    stat.textContent = 'reconnecting';
    setTimeout(connect, 1000);
  };
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && pending) { pending = null; ask(); }
});
connect();

// Controls: load the control page in a frame over the picture and stop asking for frames
// while it is up. Its View button posts "view" back, which removes the frame again.
var ctlwrap = document.getElementById('ctlwrap');
document.getElementById('controls').onclick = function (e) {
  e.stopPropagation();
  showUi(false);
  paused = true;
  ctlwrap.innerHTML = '<iframe id="ctl" src="/"></iframe>';
  ctlwrap.className = 'on';
};
window.addEventListener('message', function (e) {
  if (e.origin !== location.origin || e.data !== 'view') return;
  ctlwrap.className = '';
  ctlwrap.innerHTML = '';
  paused = false;
  if (pending) { pending = null; ask(); }
});

// ---------------------------------------------------------------- stereo control overlay
// See the CSS comment for the layout. One list of rows, shown in both eyes; one row is
// highlighted (the cursor). Left margin: drag = move the cursor, tap = act on it. Right
// margin: drag up/down = change the cursor row's value, tap = flip a switch / next option.
// Tapping a row in either panel also selects it. Talks to the control page's server socket.
var hud = document.getElementById('hud'), overlayBtn = document.getElementById('overlay');
var heads = hud.querySelectorAll('.phead'), lists = hud.querySelectorAll('.plist');
var ls = document.getElementById('ls'), rs = document.getElementById('rs'),
    navs = hud.querySelectorAll('.nav'), sliders = hud.querySelectorAll('.vs'), knobs = hud.querySelectorAll('.knob');
var hudOn = false, cws = null, model = null, rows = [], cursor = 0,
    liveT = null, depth = null, lastKey = {};
try {
  hudOn = localStorage.getItem('hud') === '1';
  var dv = localStorage.getItem('huddepth'); if (dv !== null && dv !== '') depth = parseFloat(dv) || 0;
} catch (e) {}

function eachFilter(fn) {
  model.tabs.forEach(function (tab) {
    tab.stages.forEach(function (st) { st.filters.forEach(function (f) { fn(tab, f); }); });
  });
}
function valueOf(f, p) { var v = f.values ? f.values[p.key] : undefined; return v === undefined || v === null ? p['default'] : v; }

// Depth of the overlay: how far the two copies are pushed towards each other, in screen
// points (+ = nearer). Set with the "Overlay depth" row at the top of the list while
// looking through the viewer; remembered on this device. Until it has been set it starts at
// the rig's global zero (canvas px, 1920 per eye) scaled to this screen.
function sizeHud() {
  var ew = hud.clientWidth / 2 || 400;
  if (depth === null && model) {
    var zero = 0;
    eachFilter(function (tab, f) { if (f.name === 'global zero' && f.params[0]) zero = +valueOf(f, f.params[0]) || 0; });
    depth = Math.round(zero * ew / 1920);
  }
  var pop = depth || 0;
  hud.style.setProperty('--ew', ew + 'px');
  hud.style.setProperty('--pop', pop.toFixed(1) + 'px');
  hud.style.setProperty('--base', (Math.abs(pop) / 2).toFixed(1) + 'px');   // keeps both copies inside their eye
  placeSpacers();
}
window.addEventListener('resize', sizeHud);
var depthRow = { kind: 'local', label: 'Overlay depth', key: 'local:depth', min: -80, max: 80, step: 0.5,
  get: function () { return depth || 0; },
  set: function (v) { depth = v; try { localStorage.setItem('huddepth', String(v)); } catch (e) {} sizeHud(); } };

function wake() {                       // full strength while in use, fades 2.5 s after
  hud.classList.add('live');
  clearTimeout(liveT);
  liveT = setTimeout(function () { hud.classList.remove('live'); }, 2500);
}
hud.addEventListener('pointerdown', wake, true);
hud.addEventListener('scroll', wake, true);

function csend(m) { if (cws && cws.readyState === 1) cws.send(JSON.stringify(m)); }
// at most one write per parameter every 33 ms, always the newest value
var outQ = {}, outT = null;
function queue(c, p, v) {
  outQ[c.tab.source + '\n' + c.f.name + '\n' + p.key] = { t: 'set', s: c.tab.source, f: c.f.name, k: p.key, v: v };
  if (!outT) outT = setTimeout(function () {
    outT = null;
    var q = outQ; outQ = {};
    Object.keys(q).forEach(function (k) { csend(q[k]); });
  }, 33);
}

function decimals(p) {
  var st = p.step || (p.max - p.min) / 200;
  return p.type === 'int' || st >= 1 ? 0 : st >= 0.1 ? 1 : st >= 0.01 ? 2 : 3;
}
function isNum(p) { return p.type !== 'bool' && !p.options && typeof p.min === 'number' && typeof p.max === 'number'; }
function optKeys(p) { return Object.keys(p.options).map(Number).sort(function (a, b) { return a - b; }); }
function el(cls, text) { var d = document.createElement('div'); d.className = cls; if (text !== undefined) d.textContent = text; return d; }

// ---- rows. kind: nav | sect | sw (a switch: get/set) | param
function swRow(label, get, set) { return { kind: 'sw', label: label, get: get, set: set }; }
// One tree, no pages and no back rows: tab > filter > section > control. Every branch starts
// collapsed; its row opens or closes it (not remembered across reloads).
var open = {};
function fold(id, label, level, path, f) {
  return { kind: 'nav', fold: true, key: 'fold:' + id, level: level, path: path,
           label: (open[id] ? '▾ ' : '▸ ') + label, note: f && !f.on ? 'off' : '', dim: f && !f.on,
           go: function () { open[id] = !open[id]; lastKey.par = 'fold:' + id; build(); } };
}
function makeRows() {
  var out = [];
  if (!model) return out;
  function add(r, level, path) { r.level = level; r.path = path; out.push(r); }
  add(depthRow, 0, 'Overlay');
  out.push(fold('layers', 'Layers', 0, 'Layers'));
  if (open.layers) model.layers.forEach(function (l) {
    add(swRow(l.name, function () { return l.on; },
              function (on) { l.on = on; csend({ t: 'item', scene: l.scene, id: l.id, on: on }); }), 1, 'Layers');
  });
  model.tabs.forEach(function (tab) {
    var tid = 't/' + tab.id, any = false;
    tab.stages.forEach(function (st) { st.filters.forEach(function (f) { if (f.params.length) any = true; }); });
    if (!any) return;
    out.push(fold(tid, tab.title, 0, tab.title));
    if (!open[tid]) return;
    tab.stages.forEach(function (st) { st.filters.forEach(function (f) {
      if (!f.params.length) return;
      var fid = tid + '/' + f.name, path = tab.title + ' · ' + f.name, c = { tab: tab, f: f };
      out.push(fold(fid, f.name, 1, path, f));
      if (!open[fid]) return;
      if (!f.virtual && !(f.essential && f.on)) {
        var sw = swRow('Filter', function () { return f.on; },
                       function (on) { f.on = on; csend({ t: 'en', s: tab.source, f: f.name, on: on }); });
        sw.key = fid + '/on';
        add(sw, 2, path);
      }
      var section = null;
      f.params.forEach(function (p) {
        if (p.section && p.section !== section) { section = p.section; out.push(fold(fid + '/' + section, section, 2, path)); }
        if (!p.section || open[fid + '/' + p.section]) {
          add({ kind: 'param', label: p.label || p.key, c: c, p: p, key: fid + '/' + p.key }, p.section ? 3 : 2, path);
        }
      });
    }); });
  });
  return out;
}
function rowText(r) {
  if (r.kind === 'sw') return r.get() ? 'on' : 'off';
  if (r.kind === 'nav') return r.note || '';
  if (r.kind === 'local') return r.get().toFixed(1);
  if (r.kind !== 'param') return '';
  var v = valueOf(r.c.f, r.p);
  if (r.p.type === 'bool') return v ? 'on' : 'off';
  if (r.p.options) return r.p.options[String(Math.round(v))] || String(v);
  return typeof v === 'number' ? v.toFixed(decimals(r.p)) : String(v);
}
function frac(r) {
  if (r.kind === 'local') return (r.get() - r.min) / (r.max - r.min);
  if (r.kind !== 'param' || !isNum(r.p)) return null;
  return Math.max(0, Math.min(1, (valueOf(r.c.f, r.p) - r.p.min) / ((r.p.max - r.p.min) || 1)));
}
function paint(r) {
  var t = rowText(r), f = frac(r);
  r.els.forEach(function (e) {
    e.val.textContent = t;
    if (e.fill) e.fill.style.width = (f * 100) + '%';
  });
  if (rows[cursor] === r) paintKnob();
}
function paintKnob() {
  var f = rows[cursor] ? frac(rows[cursor]) : null;
  for (var k = 0; k < 2; k++) {
    knobs[k].style.display = f === null ? 'none' : 'block';
    if (f !== null) knobs[k].style.top = ((1 - f) * 100) + '%';
  }
}
function setCursor(i, scroll) {
  if (!rows[i]) return;
  if (scroll) quiet = Date.now() + 250;
  if (rows[cursor]) rows[cursor].els.forEach(function (e) { e.row.classList.remove('cur'); });
  cursor = i;
  rows[i].els.forEach(function (e, k) {
    e.row.classList.add('cur');
    if (scroll) lists[k].scrollTop = e.row.offsetTop + e.row.offsetHeight / 2 - lists[k].clientHeight / 2;   // to the centre line
  });
  if (rows[i].key) lastKey.par = rows[i].key;
  heads[0].textContent = heads[1].textContent = rows[i].path || 'Controls';   // where the highlighted row lives
  paintKnob();
}
function step(from, dir) {              // next selectable row in a direction, or the same one
  var i = from + dir;
  return i >= 0 && i < rows.length ? i : from;
}
// a tap: follow a nav row, flip a switch, next option. Numbers do nothing on a tap.
function activate(r) {
  if (!r) return;
  if (r.kind === 'nav') { r.go(); return; }
  if (r.kind === 'sw') { r.set(!r.get()); paint(r); return; }
  if (r.kind === 'param' && !isNum(r.p)) {
    var v = valueOf(r.c.f, r.p);
    if (r.p.type === 'bool') put(r, !v);
    else { var k = optKeys(r.p); put(r, k[(k.indexOf(Math.round(v)) + 1) % k.length]); }
  }
}
function put(r, v) {
  if (v === valueOf(r.c.f, r.p)) return;
  r.c.f.values = r.c.f.values || {};
  r.c.f.values[r.p.key] = v;
  paint(r);
  queue(r.c, r.p, v);
}
// the right-hand slider: dy screen points since the touch began (up = more). A number's
// whole range is three quarters of the screen height; switches and options step.
function grabValue(r) {
  if (r.kind === 'sw') return r.get() ? 1 : 0;
  if (r.kind === 'local') return r.get();
  var v = valueOf(r.c.f, r.p);
  if (r.kind === 'param' && r.p.options) return optKeys(r.p).indexOf(Math.round(v));
  return +v;
}
function slide(r, v0, dy) {
  var up = -dy;
  if (r.kind === 'sw') { var on = up > 24 ? true : up < -24 ? false : !!v0; if (on !== r.get()) { r.set(on); paint(r); } return; }
  if (r.kind === 'local') {
    var lv = Math.round((v0 + up / (window.innerHeight * 0.75) * (r.max - r.min)) / r.step) * r.step;
    r.set(Math.max(r.min, Math.min(r.max, lv))); paint(r); return;
  }
  if (r.kind !== 'param') return;
  var p = r.p;
  if (p.type === 'bool') { put(r, up > 24 ? true : up < -24 ? false : !!v0); return; }
  if (p.options) { var k = optKeys(p); put(r, k[Math.max(0, Math.min(k.length - 1, v0 + Math.round(up / 44)))]); return; }
  if (!isNum(p)) return;
  var v = v0 + up / (window.innerHeight * 0.75) * (p.max - p.min), st = p.step || 0;
  if (p.type === 'int') st = Math.max(1, st);
  if (st) v = Math.round(v / st) * st;
  put(r, Math.max(p.min, Math.min(p.max, +v.toFixed(6))));
}

function build() {
  rows = makeRows();
  for (var k = 0; k < 2; k++) { heads[k].textContent = model ? 'Controls' : 'connecting…'; lists[k].innerHTML = ''; lists[k].scrollTop = 0; }
  rows.forEach(function (r, i) {
    r.els = [];
    for (var k = 0; k < 2; k++) {
      var row = el('prow l' + (r.level || 0) + (r.fold ? ' sect' : '') + (r.dim ? ' dim' : ''));
      var e = { row: row, val: el('val') };
      row.appendChild(el('lab', r.label));
      if (r.kind !== 'sect') row.appendChild(e.val);
      if (frac(r) !== null) { e.fill = el('fill'); row.appendChild(e.fill); }
      if (r.kind !== 'sect') row.onclick = (function (i, r) {
        return function () { var was = cursor === i; setCursor(i, true); if (was || r.kind === 'nav') activate(r); };
      })(i, r);
      lists[k].appendChild(row);
      r.els.push(e);
    }
    paint(r);
  });
  for (var q = 0; q < 2; q++) {            // room above and below so the first and last row can reach the centre
    spacers[q] = [el('pspace'), el('pspace')];
    lists[q].insertBefore(spacers[q][0], lists[q].firstChild);
    lists[q].appendChild(spacers[q][1]);
  }
  placeSpacers();
  // start on the row used last in this mode, else the first control
  var want = lastKey.par, start = -1;
  rows.forEach(function (r, i) {
    if (want && r.key === want && start < 0) start = i;
  });
  sizeHud();
  cursor = -1;
  setCursor(start >= 0 ? start : Math.min(1, rows.length - 1), true);
}

// keep the two copies scrolled alike when a panel is scrolled directly
var syncing = false, quiet = 0, spacers = [];
function placeSpacers() {
  for (var q = 0; q < spacers.length; q++) {
    var h = Math.max(0, lists[q].clientHeight / 2 - 14) + 'px';
    spacers[q][0].style.height = h; spacers[q][1].style.height = h;
  }
}
[0, 1].forEach(function (i) {
  lists[i].addEventListener('scroll', function () {
    if (syncing) return;
    syncing = true;
    lists[1 - i].scrollTop = lists[i].scrollTop;
    setTimeout(function () { syncing = false; }, 0);
    if (Date.now() < quiet) return;       // a scroll we started ourselves (button, tap)
    // scrolled by hand: highlight whichever row is now on the centre line
    var mid = lists[i].scrollTop + lists[i].clientHeight / 2, best = -1, bd = 1e9;
    rows.forEach(function (r, n) {
      var e = r.els[i].row, d = Math.abs(e.offsetTop + e.offsetHeight / 2 - mid);
      if (d < bd) { bd = d; best = n; }
    });
    if (best >= 0 && best !== cursor) setCursor(best, false);
  });
});

// ---- the two margins
function strip(node, onStart, onMove, onTap, onEnd) {
  var y0 = 0, down = false, moved = false;
  node.addEventListener('pointerdown', function (e) {
    down = true; moved = false; y0 = e.clientY;
    e.stopPropagation();
    try { node.setPointerCapture(e.pointerId); } catch (err) {}
    wake(); onStart();
    e.preventDefault();
  });
  node.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dy = e.clientY - y0;
    if (!moved && Math.abs(dy) < 6) return;
    moved = true; wake(); onMove(dy);
  });
  function end() { if (down && !moved) onTap(y0); down = false; if (onEnd) onEnd(); }
  node.addEventListener('pointerup', end);
  node.addEventListener('pointercancel', function () { down = false; if (onEnd) onEnd(); });
}
// Left side (the nav column in either eye, and the black margin beside it): drag = move the
// highlight one row per 40 points; tap the top third = up one, bottom third = down one,
// middle = act on the highlighted row (open, flip, next option).
var c0 = 0, grab = null;
function navTap(y) {
  var r = hud.getBoundingClientRect(), t = (y - r.top) / (r.height || 1);
  if (t < 0.36) setCursor(step(cursor, -1), true);
  else if (t > 0.64) setCursor(step(cursor, 1), true);
  else activate(rows[cursor]);
}
[ls, navs[0], navs[1]].forEach(function (n) {
  strip(n, function () { c0 = cursor; }, function (dy) {
    var k = Math.round(dy / 44), i = c0, dir = k > 0 ? 1 : -1;
    for (var j = 0; j < Math.abs(k); j++) i = step(i, dir);
    if (i !== cursor) setCursor(i, true);
  }, navTap);
});
// Right side (the slider in either eye, and the black margin beside it): one vertical slider
// for the highlighted row; a tap flips a switch or steps an option.
[rs, sliders[0], sliders[1]].forEach(function (n) {
  strip(n, function () { var r = rows[cursor]; grab = r && r.kind !== 'nav' ? { r: r, v0: grabValue(r) } : null; },
        function (dy) {
          if (!grab) return;
          // out of the way while a value is being changed (not for the overlay's own depth)
          if (grab.r.kind !== 'local') hud.classList.add('adjust');
          slide(grab.r, grab.v0, dy);
        },
        function () { var r = rows[cursor]; if (r && r.kind !== 'nav') activate(r); },
        function () { hud.classList.remove('adjust'); wake(); });
});

function cconnect() {
  if (!hudOn || (cws && cws.readyState < 2)) return;
  cws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  cws.onmessage = function (e) {
    var m = JSON.parse(e.data);
    if (m.t === 'model') { model = m; build(); return; }
    if (!model) return;
    if (m.t === 'v') {
      eachFilter(function (tab, f) {
        if (tab.source !== m.s || f.name !== m.f) return;
        f.values = f.values || {};
        Object.keys(m.k).forEach(function (k) {
          f.values[k] = m.k[k];
          rows.forEach(function (r) { if (r.kind === 'param' && r.c.f === f && r.p.key === k && !(grab && grab.r === r)) paint(r); });
        });
        if (f.name === 'global zero') sizeHud();
      });
    } else if (m.t === 'en') {
      eachFilter(function (tab, f) { if (tab.source === m.s && f.name === m.f) f.on = m.on; });
      build();
    } else if (m.t === 'item') {
      model.layers.forEach(function (l) { if (l.scene === m.scene && l.id === m.id) l.on = m.on; });
      rows.forEach(function (r) { if (r.kind === 'sw') paint(r); });
    }
  };
  cws.onclose = function () { cws = null; model = null; if (hudOn) { build(); setTimeout(cconnect, 1500); } };
}

function applyHud() {
  document.body.classList.toggle('hud', hudOn);
  overlayBtn.className = hudOn ? 'on' : '';
  try { localStorage.setItem('hud', hudOn ? '1' : '0'); } catch (e) {}
  if (hudOn) { build(); cconnect(); wake(); }
  else if (cws) { try { cws.close(); } catch (e) {} }
}
overlayBtn.onclick = function () { hudOn = !hudOn; applyHud(); };
applyHud();
</script>
</body>
</html>
