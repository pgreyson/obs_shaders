<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rig view</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccd; overflow: hidden;
               font: 14px -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  /* Alignment guides for a clip-on stereo viewer: two vertical lines, symmetric about the screen
     centre, drawn behind the picture so they show only in the black above and below it. */
  :root { --pw: min(100vw, calc(100vh * 32 / 9)); --gap: 0.5; }
  .guide { position: fixed; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #808080; display: none; }
  body.guides .guide { display: block; }
  #gl { left: calc(50% - var(--pw) * var(--gap) / 2); }
  #gr { left: calc(50% + var(--pw) * var(--gap) / 2); }
  #pic { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 8px; align-items: center;
         padding: 10px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
         background: rgba(17, 20, 26, .88); }
  body.ui #bar { display: flex; }
  button, a.btn { font: inherit; color: #ccd; background: #222733; border: 1px solid #343b4b; border-radius: 8px;
                  padding: 8px 12px; text-decoration: none; }
  button.on { background: #2d5fd0; border-color: #2d5fd0; color: #fff; }
  #stat { margin-left: auto; color: #8a93a6; font-variant-numeric: tabular-nums; }
  #stat.bad { color: #ff8a70; }
</style>
</head>
<body>
<div class="guide" id="gl"></div><div class="guide" id="gr"></div>
<img id="pic" alt="">
<div id="bar">
  <button id="lines">Lines</button>
  <button id="closer">&#8722;</button>
  <button id="wider">+</button>
  <button id="sharp">Sharp</button>
  <button id="full">Full screen</button>
  <a class="btn" href="/">Controls</a>
  <span id="stat">connecting…</span>
</div>
<script>
// Pulls JPEG frames of the program picture one after another. Each request waits on the
// server for a frame newer than the last one shown, so the rate follows the link speed.
var pic = document.getElementById('pic'), bar = document.getElementById('bar'),
    stat = document.getElementById('stat'), sharpBtn = document.getElementById('sharp'),
    fullBtn = document.getElementById('full');
var sharp = false, seq = 0, shown = [], lastUrl = null, hideTimer = null;
try { sharp = localStorage.getItem('sharp') === '1'; } catch (e) {}

// The picture fills the screen with nothing over it. A tap shows the bar; another tap, or
// 5 s without touching it, hides it again.
function showUi(on) {
  document.body.classList.toggle('ui', on);
  clearTimeout(hideTimer);
  if (on) hideTimer = setTimeout(function () { showUi(false); }, 5000);
}
pic.onclick = function () { showUi(!document.body.classList.contains('ui')); };
bar.onclick = function () { showUi(true); };

function applyUi() {
  sharpBtn.className = sharp ? 'on' : '';
  try { localStorage.setItem('sharp', sharp ? '1' : '0'); } catch (e) {}
}
sharpBtn.onclick = function () { sharp = !sharp; applyUi(); };
var root = document.documentElement;
var goFull = root.requestFullscreen || root.webkitRequestFullscreen;
if (!goFull) fullBtn.style.display = 'none';      // iPhone Safari: use Add to Home Screen instead
fullBtn.onclick = function () {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    try { goFull.call(root); } catch (e) {}
  }
};
applyUi();

// Guide lines: on/off and spacing (fraction of the picture width; 0.5 = the two eye centres),
// remembered on this device. - / + move them 0.5 % of the picture width per tap.
var guides = true, gap = 0.5;
try {
  guides = localStorage.getItem('guides') !== '0';
  gap = parseFloat(localStorage.getItem('gap')) || gap;
} catch (e) {}
function applyGuides() {
  gap = Math.min(1, Math.max(0.02, gap));
  document.body.classList.toggle('guides', guides);
  document.documentElement.style.setProperty('--gap', gap.toFixed(3));
  document.getElementById('lines').className = guides ? 'on' : '';
  try { localStorage.setItem('guides', guides ? '1' : '0'); localStorage.setItem('gap', gap.toFixed(3)); } catch (e) {}
}
document.getElementById('lines').onclick = function () { guides = !guides; applyGuides(); };
document.getElementById('closer').onclick = function () { guides = true; gap -= 0.005; applyGuides(); };
document.getElementById('wider').onclick = function () { guides = true; gap += 0.005; applyGuides(); };
applyGuides();

function width() { return sharp ? 2560 : 1280; }

function next(delay) { setTimeout(pull, delay); }

function pull() {
  if (document.hidden) { next(500); return; }
  fetch('/frame.jpg?w=' + width() + '&after=' + seq, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('no picture');
    var s = parseInt(r.headers.get('X-Seq') || '0', 10);
    return r.blob().then(function (b) {
      if (s !== seq) {
        seq = s;
        var url = URL.createObjectURL(b);
        pic.onload = function () { if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = url; };
        pic.src = url;
        var now = Date.now();
        shown.push(now);
        while (shown.length && now - shown[0] > 2000) shown.shift();
        stat.className = '';
        stat.textContent = (shown.length / 2).toFixed(0) + ' fps · ' + Math.round(b.size / 1024) + ' KB';
      }
      next(0);
    });
  }).catch(function () {
    stat.className = 'bad';
    stat.textContent = 'no picture, retrying';
    next(1500);
  });
}
pull();
</script>
</body>
</html>
