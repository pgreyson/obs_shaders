<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rig view</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccd; overflow: hidden;
               font: 14px -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  /* Alignment guides for a clip-on / Cardboard stereo viewer: two fixed vertical lines either
     side of the screen centre, drawn over the picture. */
  .guide { position: fixed; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #1c1c1c;
           z-index: 2; pointer-events: none; }
  #gl { left: calc(50% - 8.5px); }
  #gr { left: calc(50% + 8.5px); }
  /* The picture is centred and can be smaller than the screen (black on all sides), so that
     the two eye pictures sit under the lenses of a phone viewer: their centres are half the
     picture width apart. */
  :root { --sw: 100vw; --sh: 100vh; --w: var(--sw); }
  :root.phone { --w: calc(var(--sw) * 0.865); }
  #root { position: fixed; top: 0; left: 0; width: var(--sw); height: var(--sh); overflow: hidden; }
  /* the guide lines are for the phone viewer, which is used in landscape only */
  @media (orientation: portrait) { .guide { display: none; } }
  #pic { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block;
         width: min(var(--w), var(--sw), calc(var(--sh) * 32 / 9)); aspect-ratio: 32 / 9; }
  #bar { z-index: 3; position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 8px; align-items: center;
         padding: 10px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
         background: rgba(17, 20, 26, .88); }
  body.ui #bar { display: flex; }
  button, a.btn { font: inherit; color: #ccd; background: #222733; border: 1px solid #343b4b; border-radius: 8px;
                  padding: 8px 12px; text-decoration: none; }
  button.on { background: #2d5fd0; border-color: #2d5fd0; color: #fff; }
  #stat { margin-left: auto; color: #8a93a6; font-variant-numeric: tabular-nums; }
  #stat.bad { color: #ff8a70; }
  /* The control page opens inside this page (no navigation), so a Home Screen web app keeps
     running without iOS adding its browser bar. */
  #ctlwrap { position: fixed; inset: 0; z-index: 5; background: #0e1013; display: none; }
  #ctlwrap.on { display: block; }
  #ctl { position: absolute; border: 0; top: env(safe-area-inset-top); left: env(safe-area-inset-left);
         width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
         height: calc(100% - env(safe-area-inset-top)); }
</style>
<link rel="manifest" href="/manifest.json">
</head>
<body>
<div id="root">
<div class="guide" id="gl"></div><div class="guide" id="gr"></div>
<img id="pic" alt="">
<div id="bar">
  <button id="full">Full screen</button>
  <button id="controls">Controls</button>
  <span id="stat">connecting…</span>
</div>
</div>
<div id="ctlwrap"></div>
<script>
var pic = document.getElementById('pic'), bar = document.getElementById('bar'),
    stat = document.getElementById('stat'),
    fullBtn = document.getElementById('full');
var seq = 0, shown = [], lastUrl = null, hideTimer = null;

// The picture fills the screen with nothing over it. A tap shows the bar; another tap, or
// 5 s without touching it, hides it again.
function showUi(on) {
  document.body.classList.toggle('ui', on);
  clearTimeout(hideTimer);
  if (on) hideTimer = setTimeout(function () { showUi(false); }, 5000);
}
document.addEventListener('click', function (e) {
  if (!bar.contains(e.target)) showUi(!document.body.classList.contains('ui'));
});
bar.onclick = function () { showUi(true); };

var root = document.documentElement;
var goFull = root.requestFullscreen || root.webkitRequestFullscreen;
if (!goFull) fullBtn.style.display = 'none';      // iPhone Safari: use Add to Home Screen instead
fullBtn.onclick = function () {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    try { goFull.call(root); } catch (e) {}
  }
};

// Picture width: fixed at 86.5 % of the screen width on a phone (set by eye against a
// Cardboard-type viewer, 2026-11-20); full width on bigger screens.
if (Math.max(screen.width, screen.height) < 1000) document.documentElement.classList.add('phone');

function width() { return 2560; }      // 1280 per eye: about what a phone shows per eye

// Frames arrive over one WebSocket as binary JPEGs. The page asks for the next frame only
// when the previous one is on screen, so the rate follows what the link and phone can do
// (up to the rig's 30 fps) and frames never queue up behind each other.
var ws = null, pending = null, waiting = null, paused = false;

function ask() {
  if (ws && ws.readyState === 1) {
    ws.send(String(width()));
    clearTimeout(waiting);
    waiting = setTimeout(function () { try { ws.close(); } catch (e) {} }, 5000);
  }
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/live');
  ws.binaryType = 'blob';
  ws.onopen = ask;
  ws.onmessage = function (e) {
    if (typeof e.data === 'string') {            // "none": no relay instance has a picture
      stat.className = 'bad';
      stat.textContent = 'no picture, retrying';
      setTimeout(ask, 1000);
      return;
    }
    var url = URL.createObjectURL(e.data), size = e.data.size;
    pic.onload = pic.onerror = function () {
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = url;
      var now = Date.now();
      shown.push(now);
      while (shown.length && now - shown[0] > 2000) shown.shift();
      stat.className = '';
      stat.textContent = (shown.length / 2).toFixed(0) + ' fps · ' + Math.round(size / 1024) + ' KB';
      if (document.hidden || paused) pending = true; else ask();
    };
    pic.src = url;
  };
  ws.onclose = function () {
    clearTimeout(waiting);
    stat.className = 'bad';
    stat.textContent = 'reconnecting';
    setTimeout(connect, 1000);
  };
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && pending) { pending = null; ask(); }
});
connect();

// Controls: load the control page in a frame over the picture and stop asking for frames
// while it is up. Its View button posts "view" back, which removes the frame again.
var ctlwrap = document.getElementById('ctlwrap');
document.getElementById('controls').onclick = function (e) {
  e.stopPropagation();
  showUi(false);
  paused = true;
  ctlwrap.innerHTML = '<iframe id="ctl" src="/"></iframe>';
  ctlwrap.className = 'on';
};
window.addEventListener('message', function (e) {
  if (e.origin !== location.origin || e.data !== 'view') return;
  ctlwrap.className = '';
  ctlwrap.innerHTML = '';
  paused = false;
  if (pending) { pending = null; ask(); }
});
</script>
</body>
</html>
