<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>Recordings</title>
<style>
:root {
  --bg: #0e1013; --panel: #171a1f; --panel2: #1e2228; --line: #2a2f37;
  --text: #e8eaed; --dim: #8b929c; --accent: #5cc8ff; --accent-dim: #1d4a63;
  --on: #58d68d; --warn: #f5b041; --bad: #ec7063;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font: inherit; font-size: 12px; padding: 6px 11px; border-radius: 999px; background: var(--panel2);
  color: var(--dim); white-space: nowrap; border: 0; text-decoration: none; font-variant-numeric: tabular-nums; }
.pill.on { background: var(--accent-dim); color: var(--text); }
.grow { flex: 1; }

/* The player. Portrait: picture across the top, list under it. Landscape: the picture alone
   fills the screen and a tap brings the controls up for a few seconds. */
#stage { display: none; background: #000; }
body.playing #stage { display: block; }
#clip { overflow: hidden; width: 100%; aspect-ratio: 32 / 9; background: #000; margin: 0 auto; }
#clip.one { aspect-ratio: 16 / 9; }
video { display: block; width: 100%; height: 100%; background: #000; }
#clip.one video { width: 200%; }                 /* left eye only: the left half of the SBS frame */
#bar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; }
#bar .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#bar .row + .row { margin-top: 8px; }
#now { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 9.5em; }
#seek { flex: 1; min-width: 120px; accent-color: var(--accent); height: 28px; }
#wait { color: var(--warn); font-size: 12px; }
@media (orientation: portrait) {
  body.playing #stage { position: sticky; top: 0; z-index: 6; padding-top: env(safe-area-inset-top); }
  body.playing header { position: static; }
}
@media (orientation: landscape) {
  body.playing { overflow: hidden; }
  body.playing header, body.playing main { display: none; }
  body.playing #stage { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
  body.playing #clip { width: min(100vw, calc(100dvh * 32 / 9)); }
  body.playing #clip.one { width: min(100vw, calc(100dvh * 16 / 9)); }
  body.playing #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; border: 0;
    background: rgba(14, 16, 19, .86); display: none;
    padding: 10px max(14px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right)); }
  body.playing.ui #bar { display: block; }
}

main { padding: 4px 12px calc(env(safe-area-inset-bottom) + 30px); }
h2 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 18px 0 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.rec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
  color: var(--text); font: inherit; text-align: left; font-variant-numeric: tabular-nums; }
.rec small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
.rec.cur { border-color: var(--accent); background: var(--accent-dim); }
.rec.open small { color: var(--warn); }
.rec.prores { border-style: dashed; }
.rec.prores b { color: var(--accent); font-weight: 600; font-size: 11px; margin-left: 5px; }
#empty { color: var(--dim); padding: 40px 10px; text-align: center; }
</style>
</head>
<body>
<header>
  <a class="pill" href="/view">Live</a>
  <a class="pill" href="/">Controls</a>
  <span class="grow"></span>
  <span class="pill" id="count"></span>
  <button class="pill" id="refresh">Refresh</button>
</header>
<div id="stage">
  <div id="clip"><video id="v" playsinline webkit-playsinline preload="auto"></video></div>
  <div id="bar">
    <div class="row">
      <button class="pill on" id="pp">Pause</button>
      <span id="now"></span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <span id="wait"></span>
    </div>
    <div class="row">
      <button class="pill" id="prev">Previous</button>
      <button class="pill" id="next">Next</button>
      <span id="speeds"></span>
      <span class="grow"></span>
      <button class="pill" id="eye">One eye</button>
      <button class="pill" id="close">Close</button>
    </div>
  </div>
</div>
<main id="list"><div id="empty">Loading…</div></main>
<script>
const $ = (s) => document.querySelector(s);
const v = $("#v"), clip = $("#clip"), seek = $("#seek");
let recs = [], cur = -1, offset = 10, rate = 1, dragging = false, uiTimer = null;
const two = (n) => String(n).padStart(2, "0");
const hm = (t) => { const d = new Date(t * 1000); return two(d.getHours()) + ":" + two(d.getMinutes()); };
const day = (t) => new Date(t * 1000).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
const mediaUrl = (r) => location.protocol + "//" + location.hostname + ":" + (parseInt(location.port || (location.protocol === "https:" ? 443 : 80), 10) + offset)
  + "/media/" + r.id.split("/").map(encodeURIComponent).join("/");

function pref(k, d) { try { const x = localStorage.getItem(k); return x === null ? d : x; } catch (e) { return d; } }
function keep(k, x) { try { localStorage.setItem(k, x); } catch (e) {} }

function draw() {
  const list = $("#list"); list.textContent = "";
  const arch = recs.filter((r) => r.kind === "archive");
  $("#count").textContent = arch.length ? arch.length + " archive hours · " + Math.round(arch.reduce((a, r) => a + r.gb, 0)) + " GB" : "";
  if (!recs.length) { const e = document.createElement("div"); e.id = "empty"; e.textContent = "No recordings found."; list.append(e); return; }
  let lastDay = "", grid = null;
  for (let i = recs.length - 1; i >= 0; i--) {           // newest day first, newest hour first
    const r = recs[i], d = day(r.start);
    if (d !== lastDay) {
      lastDay = d;
      const h = document.createElement("h2"); h.textContent = d; list.append(h);
      grid = document.createElement("div"); grid.className = "grid"; list.append(grid);
    }
    const b = document.createElement("button");
    b.className = "rec" + (i === cur ? " cur" : "") + (r.open ? " open" : "") + (r.kind === "prores" ? " prores" : "");
    const mins = Math.max(0, Math.round((r.end - r.start) / 60));
    b.append(hm(r.start));
    if (r.kind === "prores") { const t = document.createElement("b"); t.textContent = "ProRes"; b.append(t); }
    const s = document.createElement("small");
    s.textContent = r.open ? "recording now" : (mins >= 1 ? mins + " min" : "under 1 min") + " · " + r.gb.toFixed(1) + " GB";
    b.append(s);
    b.onclick = () => play(i, 0);
    grid.append(b);
  }
}

function label() {
  if (cur < 0) return;
  const r = recs[cur], t = r.start + (v.currentTime || 0), d = new Date(t * 1000);
  $("#now").textContent = d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " "
    + two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
  if (!dragging && isFinite(v.duration) && v.duration > 0) seek.value = Math.round(1000 * v.currentTime / v.duration);
}

// controls: always there in portrait; in landscape a tap on the picture shows them for a while
function showUi(on) {
  document.body.classList.toggle("ui", on);
  clearTimeout(uiTimer);
  if (on) uiTimer = setTimeout(() => { if (!dragging) showUi(false); }, 5000);
}
clip.onclick = () => showUi(!document.body.classList.contains("ui"));
$("#bar").addEventListener("pointerdown", () => showUi(true));

function play(i, at) {
  if (i < 0 || i >= recs.length) return;
  cur = i;
  document.body.classList.add("playing");
  $("#wait").textContent = "";
  v.src = mediaUrl(recs[i]);
  v.onloadedmetadata = () => { if (at) v.currentTime = at; v.playbackRate = rate; v.play().catch(() => {}); };
  v.load();
  draw(); label(); showUi(true);
  window.scrollTo({ top: 0 });
}
function stop() {
  v.pause(); v.removeAttribute("src"); v.load();
  document.body.classList.remove("playing", "ui"); cur = -1; draw();
}

// previous/next file of the same kind: the archive hours form one continuous timeline, and the
// ProRes clips (which overlap it in time) are stepped through separately
function step(dir) {
  if (cur < 0) return -1;
  for (let i = cur + dir; i >= 0 && i < recs.length; i += dir) if (recs[i].kind === recs[cur].kind) return i;
  return -1;
}
v.ontimeupdate = label;
v.onplay = () => { $("#pp").textContent = "Pause"; $("#pp").classList.add("on"); if (v.playbackRate !== rate) v.playbackRate = rate; };
v.onpause = () => { $("#pp").textContent = "Play"; $("#pp").classList.remove("on"); };
v.onwaiting = () => { $("#wait").textContent = "buffering…"; };
v.onplaying = v.oncanplay = () => { $("#wait").textContent = ""; };
v.onended = () => { const n = step(1); if (n >= 0 && !recs[n].open && recs[cur].kind === "archive") play(n, 0); };
v.onerror = () => { if (cur >= 0) $("#wait").textContent = "This device cannot play " + recs[cur].name; };
$("#pp").onclick = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
seek.oninput = () => { dragging = true; };
seek.onchange = () => { if (isFinite(v.duration)) v.currentTime = v.duration * seek.value / 1000; dragging = false; };
$("#prev").onclick = () => play(step(-1), 0);
$("#next").onclick = () => play(step(1), 0);
$("#close").onclick = stop;
$("#eye").onclick = () => setEye(!clip.classList.contains("one"));
function setEye(one) { clip.classList.toggle("one", one); $("#eye").classList.toggle("on", one); keep("rec_eye", one ? "1" : "0"); }
for (const sp of [1, 2, 4, 8, 16]) {
  const b = document.createElement("button"); b.className = "pill"; b.textContent = sp + "×"; b.dataset.sp = sp;
  b.onclick = () => setRate(sp); $("#speeds").append(b, " ");
}
function setRate(sp) {
  rate = sp; v.playbackRate = sp; keep("rec_rate", String(sp));
  for (const b of $("#speeds").children) b.classList.toggle("on", Number(b.dataset.sp) === sp);
}

async function load() {
  try {
    const j = await (await fetch("/recordings.json", { cache: "no-store" })).json();
    const curName = cur >= 0 ? recs[cur].name : null;
    recs = j.recordings; offset = j.offset;
    cur = curName ? recs.findIndex((r) => r.name === curName) : -1;   // a file may have moved to the Archive
  } catch (e) { recs = []; }
  draw();
}
$("#refresh").onclick = load;
setEye(pref("rec_eye", "1") === "1");
setRate(Number(pref("rec_rate", "1")) || 1);
load();
setInterval(() => { if (document.visibilityState === "visible" && cur < 0) load(); }, 60000);
</script>
</body>
</html>
