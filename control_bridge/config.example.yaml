# control_bridge/config.example.yaml — bridge configuration template.
# Copy to config.yaml and edit. config.yaml is gitignored.

# The two OBS instances launch_dual.sh starts. Ports match the script's flags.
obs_instances:
  viture:
    host: localhost
    port: 4455
    # Set via env var OBS_VITURE_PASSWORD if you've enabled auth in OBS.
    password: ""
  projector:
    host: localhost
    port: 4456
    # Set via env var OBS_PROJECTOR_PASSWORD if you've enabled auth in OBS.
    password: ""

# The Rebel Technology OWL-ACDC USB interface (4 DC-coupled in @ 48 kHz).
cv:
  device_name_match: "OWL-ACDC"
  sample_rate: 48000
  channels: 4
  poll_hz: 30                # how often the bridge averages and forwards samples
  change_threshold: 0.01     # only act/log when channel moves more than this

# CV channel → shader filter property mappings. Each mapping pushes one CV
# channel's value to one or more (instance, source, filter, property) targets
# in OBS, so both OBS instances stay locked together for that property.
#
# Defaults below match chromadepth.shader (single-purpose chromadepth variant):
#   ch0 → depth            (parallax amount)
#   ch1 → hue_rotation     (which hue is the "near" plane)
#   ch2 → chroma_threshold (gate dark/gray regions so they anchor at screen)
#   ch3 → reserved
#
# The OBS filter is named "stereo displace" in both scene collections.
mappings:
  - cv_channel: 0
    name: depth
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "stereo displace"
        property: depth
      - instance: projector
        source: "Video Capture Device"
        filter: "stereo displace"
        property: depth

  - cv_channel: 1
    name: hue_rotation
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "stereo displace"
        property: hue_rotation
      - instance: projector
        source: "Video Capture Device"
        filter: "stereo displace"
        property: hue_rotation

  - cv_channel: 2
    name: chroma_threshold
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "stereo displace"
        property: chroma_threshold
      - instance: projector
        source: "Video Capture Device"
        filter: "stereo displace"
        property: chroma_threshold

# Bidirectional mirroring (planned v2.5): when a property changes in one
# instance, apply the same value to the other. Not yet implemented.
mirror:
  enabled: false
