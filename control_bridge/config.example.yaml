# control_bridge/config.example.yaml — bridge configuration template.
# Copy to config.yaml and edit. config.yaml is gitignored.

# The two OBS instances launch_dual.sh starts. Ports match the script's flags.
obs_instances:
  viture:
    host: localhost
    port: 4455
    # Set via env var OBS_VITURE_PASSWORD if you've enabled auth in OBS.
    password: ""
  projector:
    host: localhost
    port: 4456
    # Set via env var OBS_PROJECTOR_PASSWORD if you've enabled auth in OBS.
    password: ""

# The Rebel Technology OWL-ACDC USB interface (4 DC-coupled in @ 48 kHz).
cv:
  device_name_match: "OWL-ACDC"
  sample_rate: 48000
  channels: 4
  poll_hz: 30                # how often the bridge averages and forwards samples
  change_threshold: 0.01     # only act/log when channel moves more than this

# CV channel → shader filter property mappings. Each mapping pushes one CV
# channel's value to one or more (instance, source, filter, property) targets
# in OBS, so both OBS instances stay locked together for that property.
# cv_range/out_range remap the bridge's float sample range (±1.0 = ±5V CV)
# into the target property range.
#
# Defaults below match the live bake + splat + palette chain:
#   ch0 → stereo splat / depth   (parallax amount — hands-on instrument)
#   ch1 → depth bake / hue_rotation (which hue is near — hands-on instrument)
#   ch2 → palette / rotation (peak phase around the hue wheel)
#   ch3 → palette / size     (number of hue likelihood peaks N, 1..16)
mappings:
  - cv_channel: 0
    name: depth
    cv_range:  [-1.0, 1.0]
    out_range: [ 0.0, 1.0]
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "stereo splat"
        property: depth
      - instance: projector
        source: "Video Capture Device"
        filter: "stereo splat"
        property: depth

  - cv_channel: 1
    name: hue_rotation
    cv_range:  [-1.0, 1.0]
    out_range: [ 0.0, 1.0]
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "depth bake"
        property: hue_rotation
      - instance: projector
        source: "Video Capture Device"
        filter: "depth bake"
        property: hue_rotation

  - cv_channel: 2
    name: palette_rotation
    cv_range:  [-1.0, 1.0]
    out_range: [ 0.0, 1.0]
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "palette"
        property: rotation
      - instance: projector
        source: "Video Capture Device"
        filter: "palette"
        property: rotation

  - cv_channel: 3
    name: palette_size
    cv_range:  [-1.0, 1.0]
    out_range: [ 1.0, 16.0]
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "palette"
        property: size
      - instance: projector
        source: "Video Capture Device"
        filter: "palette"
        property: size

# Bidirectional mirroring (planned v2.5): when a property changes in one
# instance, apply the same value to the other. Not yet implemented.
mirror:
  enabled: false
