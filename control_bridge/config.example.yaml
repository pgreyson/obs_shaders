# control_bridge/config.example.yaml — bridge configuration template.
# Copy to config.yaml and edit. config.yaml is gitignored.

# The two OBS instances launch_dual.sh starts. Ports match the script's flags.
obs_instances:
  viture:
    host: localhost
    port: 4455
    # Set via env var OBS_VITURE_PASSWORD if you've enabled auth in OBS.
    password: ""
  projector:
    host: localhost
    port: 4456
    # Set via env var OBS_PROJECTOR_PASSWORD if you've enabled auth in OBS.
    password: ""

# The Rebel Technology OWL-ACDC USB interface.
cv:
  device_name_match: "OWL-ACDC"
  sample_rate: 48000
  channels: 4
  poll_hz: 30                # how often the bridge averages and forwards samples
  change_threshold: 0.01     # only act/log when channel moves more than this

# CV channel → shader filter property mappings. Each mapping pushes one CV
# channel's value (after smoothing) to one or more (instance, source, filter,
# property) targets in OBS. The same channel value goes to every target, so
# both OBS instances stay locked together for that property.
#
# v1 of bridge.py reads each target's current value at startup but does NOT
# yet write values from CV — confirm the source/filter/property names look
# right, then enable writes in v2.
mappings:
  - cv_channel: 0
    name: depth
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "User-defined shader 2"
        property: depth
      - instance: projector
        source: "Video Capture Device"
        filter: "User-defined shader 2"
        property: depth

  - cv_channel: 1
    name: contrast
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "User-defined shader 2"
        property: contrast
      - instance: projector
        source: "Video Capture Device"
        filter: "User-defined shader 2"
        property: contrast

  - cv_channel: 2
    name: mode
    targets:
      - instance: viture
        source: "Video Capture Device"
        filter: "User-defined shader 2"
        property: mode
      - instance: projector
        source: "Video Capture Device"
        filter: "User-defined shader 2"
        property: mode

# Bidirectional mirroring: when a property changes in one instance (e.g. the
# user moves a slider in the OBS UI), apply the same value to the other instance.
# Not yet implemented in v1 of bridge.py.
mirror:
  enabled: false
  properties:
    - source: "Video Capture Device"
      filter: "User-defined shader 2"
      property: depth
    - source: "Video Capture Device"
      filter: "User-defined shader 2"
      property: contrast
    - source: "Video Capture Device"
      filter: "User-defined shader 2"
      property: mode
  pairs:
    - [viture, projector]
